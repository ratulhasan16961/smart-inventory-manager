[project]
name = "pos-erp"
version = "2.3.1"
description = "Enterprise POS & ERP System (Tkinter + SQLite)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E741"]  # long SQL strings; short loop names like `l` are used deliberately